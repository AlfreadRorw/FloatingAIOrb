name: Build ALF Vision Panel

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found."
            exit 1
          fi

          echo "SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Gradle lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALF-Vision-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------------------------------------------
      # Optional signed release
      # ---------------------------------------------

      - name: Prepare release keystore
        if: >
          env.KEYSTORE_BASE64 != '' &&
          env.KEYSTORE_PASSWORD != '' &&
          env.KEY_ALIAS != '' &&
          env.KEY_PASSWORD != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Release APK
        if: >
          env.KEYSTORE_BASE64 != '' &&
          env.KEYSTORE_PASSWORD != '' &&
          env.KEY_ALIAS != '' &&
          env.KEY_PASSWORD != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: >
          env.KEYSTORE_BASE64 != '' &&
          env.KEYSTORE_PASSWORD != '' &&
          env.KEY_ALIAS != '' &&
          env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ALF-Vision-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/release.keystore"