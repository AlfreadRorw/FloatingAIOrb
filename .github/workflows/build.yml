name: Build METAGZ Cheat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Use Gradle 8.5
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/METAGZ_Cheat_Debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/METAGZ_Cheat_Release.apk 2>/dev/null || true
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: METAGZ-Supersus-Cheat
          path: output/*.apk
          retention-days: 30
