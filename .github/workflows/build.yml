name: Build APK
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk AutoTrigger.apk
      - uses: actions/upload-artifact@v4
        with: { name: AutoTrigger-APK, path: AutoTrigger.apk }
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: AutoTrigger.apk }
