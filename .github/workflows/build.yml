name: Android CI - Hardened Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Detect Android SDK requirements
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          if [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          else
            echo "app module not found at ./app; Gradle will report the actual module error."
          fi

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -e
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Compile debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all --no-daemon

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          find . -type f -path "*/build/outputs/apk/*.apk" -print || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
