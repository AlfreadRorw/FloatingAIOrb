plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alfread.arachne'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alfread.arachne'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Kotlin 1.8 merged the old jdk7/jdk8 stdlib artifacts into kotlin-stdlib.
// Excluding stale transitive copies prevents duplicate-class failures.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

